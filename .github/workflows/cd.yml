name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}    

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: install goose on the runner
        run: go install github.com/pressly/goose/v3/cmd/goose@latest      

      - name: Build the App
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'  
      
      - name: setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: axial-gist-442811-i5

      - name: build Docker image and push
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/axial-gist-442811-i5/notely-ar-repo/notely:latest .

      - name: run db migration
        run: ./scripts/migrateup.sh  

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/axial-gist-442811-i5/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project axial-gist-442811-i5 --max-instances=4